[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lab-asset-agent"
version = "0.4.1"
description = "Optional DeepSeek initialization + GPT multimodal review-and-code + local Blender agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0,<2",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.2",
  "typer>=0.15.1",
  "rich>=13.9.4",
  "Pillow>=11.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
lab-asset-agent = "lab_asset_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_asset_agent"]
