project_root: .

blender:
  executable: "blender"
  timeout_seconds: 900
  render_engine: BLENDER_EEVEE
  resolution: 768
  minimum_render_count: 3

models:
  # Only controls the first script:
  #   deepseek -> use initial_writer below
  #   gpt      -> use iteration_agent below for the first script too
  initial_generator: gpt

  # Optional when initial_generator=gpt. Keep it configured to compare initial
  # scripts generated by DeepSeek versus GPT without changing the later loop.
  initial_writer:
    base_url: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-reasoner
    max_tokens: 12000
    temperature: 0.1
    max_retries: 8
    connect_timeout_seconds: 120
    request_timeout_seconds: 900
    response_format_mode: text
    stream: true
    stream_to_terminal: true
    # hidden | progress | full. progress shows activity without printing raw reasoning.
    stream_reasoning: progress

  # Every stage after initial generation uses this one GPT endpoint:
  # - inspect exact current Blender code + all selected render images
  # - score the asset
  # - directly return the complete revised script in the same response
  # - repair Blender errors from code + logs when rendering fails
  iteration_agent:
    base_url: "https://api.vectorengine.cn/v1"
    api_key_env: VECTOR_ENGINE_API_KEY
    model: gpt-5.6-sol
    max_tokens: 12000
    temperature: 0.1
    max_retries: 8
    connect_timeout_seconds: 120
    request_timeout_seconds: 900
    response_format_mode: text
    stream: true
    stream_to_terminal: true
    stream_reasoning: progress
    extra_images: 2
    max_image_side: 1280
    jpeg_quality: 90

loop:
  max_iterations: 8
  pass_score: 8.5
  keep_all_iterations: true
  stop_on_repeated_script: true
  max_consecutive_render_failures: 3

paths:
  toolkit: workspace/toolkit/lab_blender_toolkit.py
  reference: workspace/references/beaker_low_250ml_reference.py
  docs_dir: workspace/docs
  rules: AGENT_RULES.md
  runs_dir: runs
