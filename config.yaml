project_root: .

blender:
  executable: "blender"
  timeout_seconds: 900
  render_engine: BLENDER_EEVEE
  resolution: 768
  minimum_render_count: 3

models:
  # First script is generated by this provider. It may be text-only or vision-capable.
  initial_coder: duoyuan

  # Render review uses images and therefore must set vision: true.
  visual_reviewer: duoyuan

  # Code revision and render-error repair use text context only, so this can be
  # a pure language model.
  iterative_coder: deepseek

  # Shared settings applied to every provider below.
  stream: true
  stream_to_terminal: true
  # hidden | progress | full. progress shows activity without printing raw reasoning.
  stream_reasoning: progress
  max_retries: 8
  connect_timeout_seconds: 60
  request_timeout_seconds: 600
  max_image_side: 1280
  extra_images: 2
  jpeg_quality: 90

  # Named model sources. Add more entries here and select them above.
  providers:
    vectorengine:
      base_url: "https://api.vectorengine.cn/v1"
      api_key_env: VECTOR_ENGINE_API_KEY
      model: gpt-5.6-sol
      vision: true
      max_tokens: 12000
      temperature: 0.1

    deepseek:
      base_url: "https://api.deepseek.com"
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-reasoner
      vision: false
      max_tokens: 12000
      temperature: 0.1

    duoyuan:
      base_url: "https://duoyuanx.com/v1"
      api_key_env: DUOYUAN_API_KEY
      model: gpt-5.6-sol
      vision: true
      max_tokens: 128000
      temperature: 0.1

loop:
  max_iterations: 20
  pass_score: 9.8
  keep_all_iterations: true
  stop_on_repeated_script: true
  max_consecutive_render_failures: 3

paths:
  toolkit: workspace/toolkit/lab_blender_toolkit.py
  reference: workspace/references/beaker_low_250ml_reference.py
  docs_dir: workspace/docs
  rules: AGENT_RULES.md
  runs_dir: runs
